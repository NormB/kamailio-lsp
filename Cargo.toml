[package]
name = "kamailio-lsp"
version = "0.22.0"
edition = "2024"
# Verified by the `msrv` CI job, which builds with exactly this
# toolchain — a declared MSRV nothing checks is a wish, not a fact.
rust-version = "1.94"
description = "Language Server Protocol implementation for the Kamailio configuration file language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NormB/kamailio-lsp"

[dependencies]
dashmap = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp-server = "0.23"

# The lints the Google Rust Style Guide names
# (https://google.github.io/styleguide/rustguide.html), denied in every
# target. scripts/gate.sh and CI run clippy with these;
# tests/style_test.rs keeps the list here and in fuzz/Cargo.toml.
[lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
