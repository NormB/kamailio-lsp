name: OpenSSF Scorecard

# Scores the repository's supply-chain practices (branch protection,
# pinned dependencies, token permissions, signed releases, dangerous
# workflow patterns and others) and uploads the findings to code
# scanning. Report-only: a score does not fail a build.
#
# Several checks read repository settings rather than the tree, so the
# weekly schedule and the branch_protection_rule trigger re-run them
# when nothing in the tree has changed.

on:
  branch_protection_rule:
  schedule:
    - cron: '27 7 * * 1'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # upload the SARIF to code scanning
      security-events: write
      # publish_results mints an OIDC token
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publishes the score to the public OpenSSF API
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
