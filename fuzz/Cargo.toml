[package]
name = "kamailio-lsp-fuzz"
description = "cargo fuzz targets for what kamailio-lsp reads from outside."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: cargo fuzz builds this package on its own, with the
# nightly toolchain in rust-toolchain.toml, and depends on the server by path.
[workspace]

[package.metadata]
cargo-fuzz = true

# cargo fuzz sets `--cfg fuzzing`; a plain check or clippy of this package
# does not, so the name is declared.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# The same lints as the server's Cargo.toml (tests/style_test.rs checks
# both lists).
[lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
kamailio-lsp = { path = ".." }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "cfg"
path = "fuzz_targets/cfg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "readme"
path = "fuzz_targets/readme.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check_output"
path = "fuzz_targets/check_output.rs"
test = false
doc = false
bench = false
