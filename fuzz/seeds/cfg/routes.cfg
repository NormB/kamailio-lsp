#!KAMAILIO
#!define WITH_AUTH
loadmodule "tm.so"
loadmodule "sl.so"
modparam("tm", "fr_timer", 30000)
#!ifdef WITH_AUTH
include_file "auth.cfg"
#!endif
request_route {
	if ($rm == "INVITE") {
		t_on_failure("MISSED");
		route(RELAY);
	}
	$var(x) = $(ru{s.len});
}
route[RELAY] {
	t_relay();
}
failure_route[MISSED] {
	sl_send_reply("404", "Not here");
}
