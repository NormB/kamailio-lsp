#!KAMAILIO
# cfg.lex reads `$(...)` and `$name(...)` in state PVAR_P, which takes
# every byte up to the matching `)`: a `//`, `#` or quote in there is
# part of the pseudo-variable, never a comment or a string.
mpath="/nonexistent/modules/"
request_route {
	$ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});
	$var(a) = $(var(a){re.subst,/"//g});
	$var(b) = $(var(b){re.subst,/#//g});
	$var(c) = $hdr(X//Y) + $hdr(X#Y);
	route(AFTER);
}
route[AFTER] {
	exit; // a comment after the pseudo-variables
}
